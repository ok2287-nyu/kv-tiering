# First curves: small grid to check the pipeline end to end on the real model.
# ~10 trials x 15 runs; a few minutes on one A100.
model: Qwen/Qwen2.5-1.5B-Instruct
haystack: wikitext          # WikiText-103 test split (natural text, CC BY-SA)
out: results/needle_quick.jsonl
seed: 0
lengths: [4096]
depths: [0.1, 0.3, 0.5, 0.7, 0.9]
reps: 2
window: 64                  # observation window (last prompt queries) for importance
max_new_tokens: 16
budgets: [0.1, 0.2, 0.3]    # accounted memory / full bf16 cache
quant: {key_group_size: 32, value_group_size: 32}
methods:
  - {name: full}
  - {name: uniform, bits: 4}
  - {name: uniform, bits: 2}
  - {name: streaming}
  - {name: h2o}
  - {name: window_evict}
  - {name: tiered}
